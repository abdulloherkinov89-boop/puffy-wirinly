<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>United Burger — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f4f4f5; color: #18181b; }
    header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #fff; border-bottom: 1px solid #e4e4e7; }
    .logo { color: #d92027; font-size: 24px; font-weight: 800; text-decoration: none; }
    main { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { padding: 22px; border-radius: 16px; background: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .06); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/admin">United Admin</a>
  </header>
  <main>
    <h1>Boshqaruv paneli</h1>
    <div class="cards">
      <section class="card"><h2>Mahsulotlar</h2><p>Mahsulot qo‘shish va tahrirlash.</p></section>
      <section class="card"><h2>Buyurtmalar</h2><p>Yangi buyurtmalarni ko‘rish.</p></section>
      <section class="card"><h2>Foydalanuvchilar</h2><p>Foydalanuvchilar ro‘yxati.</p></section>
    </div>
  </main>
</body>
</html>
