<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulotlar - United Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-logo { font-family: 'Oswald', sans-serif; }
  </style>
</head>
<body class="bg-white text-zinc-900 pb-28 antialiased selection:bg-red-100">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-zinc-100 py-3.5 px-4">
    <div class="max-w-2xl mx-auto flex items-center justify-center">
      <a href="/admin" class="flex items-center gap-2 text-[#e11d2a]">
        <span class="font-logo text-2xl tracking-tight font-bold">United Admin</span>
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 10h16a1 1 0 0 0 .98-1.2C20.2 5.3 16.5 3 12 3S3.8 5.3 3.02 8.8A1 1 0 0 0 4 10zm16.5 2h-17a1.5 1.5 0 0 0 0 3h17a1.5 1.5 0 0 0 0-3zM4 17a1 1 0 0 0-1 1v.5A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5V18a1 1 0 0 0-1-1H4z"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6 space-y-5">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Mahsulotlar</h1>
      <p class="text-sm text-zinc-500 mt-0.5">Menyu, kategoriya va mahsulotlarni boshqarish</p>
    </div>

    <div id="admin-status" class="hidden rounded-2xl px-4 py-3 text-sm" role="status"></div>
    <section id="first-category" class="hidden rounded-2xl bg-[#f4f4f5] p-5 text-center">
      <h2 class="font-bold">Avval kategoriya qo‘shing</h2>
      <p class="mt-1 text-sm text-zinc-500">Mahsulot qo‘shish uchun kamida bitta kategoriya kerak.</p>
      <button id="first-category-button" type="button" class="mt-4 rounded-2xl bg-[#e11d2a] px-5 py-3 text-sm font-bold text-white">＋ Birinchi kategoriyani qo‘shish</button>
    </section>

    <div id="admin-actions" class="hidden grid grid-cols-2 gap-3">
      <button id="add-product-button" type="button" class="flex items-center justify-center gap-2 rounded-2xl bg-[#e11d2a] px-3 py-4 text-sm font-bold text-white hover:opacity-90">＋ Mahsulot qo‘shish</button>
      <button id="add-category-button" type="button" class="flex items-center justify-center gap-2 rounded-2xl bg-[#f4f4f5] px-3 py-4 text-sm font-bold text-zinc-900 hover:bg-zinc-200">＋ Kategoriya qo‘shish</button>
    </div>

    <input id="product-search" type="search" placeholder="Mahsulot qidirish..." class="hidden w-full rounded-2xl bg-[#f4f4f5] px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#e11d2a]/30">
    <div id="category-list" class="flex gap-2 overflow-x-auto"></div>
    <div id="product-list" class="space-y-3"></div>
  </main>

  <div id="admin-modal" class="fixed inset-0 z-[60] hidden items-end justify-center bg-black/40 p-0 sm:items-center sm:p-4">
    <section class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-5 sm:rounded-3xl">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="modal-title" class="text-lg font-extrabold"></h2>
        <button id="modal-close" type="button" class="rounded-full bg-zinc-100 px-3 py-1 text-lg" aria-label="Yopish">×</button>
      </div>
      <form id="category-form" class="hidden space-y-4">
        <label class="block text-sm font-semibold">Kategoriya nomi
          <input name="name" required maxlength="80" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200" placeholder="Masalan: Burgerlar">
        </label>
        <button class="w-full rounded-xl bg-[#e11d2a] py-3 font-bold text-white">Kategoriyani saqlash</button>
      </form>
      <form id="product-form" class="hidden space-y-4">
        <label class="block text-sm font-semibold">Mahsulot nomi
          <input name="name" required maxlength="120" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200" placeholder="Mahsulot nomi">
        </label>
        <label class="block text-sm font-semibold">Narxi (so‘m)
          <input name="price" required type="number" min="1" step="1" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200" placeholder="25000">
        </label>
        <label class="block text-sm font-semibold">Kategoriya
          <select name="category_id" required class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200"></select>
        </label>
        <label class="block text-sm font-semibold">Mahsulot rasmi
          <input name="image" type="file" accept="image/jpeg,image/png,image/webp" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 text-sm font-normal">
          <span class="mt-1 block text-xs font-normal text-zinc-500">JPG, PNG yoki WebP, 5 MB gacha. Yoki rasm havolasini kiriting.</span>
        </label>
        <label class="block text-sm font-semibold">Rasm havolasi (ixtiyoriy)
          <input name="image_url" type="url" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200" placeholder="https://...">
        </label>
        <label class="block text-sm font-semibold">Tavsif
          <textarea name="about" required maxlength="1000" rows="3" class="mt-1 w-full rounded-xl bg-zinc-100 px-3 py-3 font-normal outline-none focus:ring-2 focus:ring-red-200" placeholder="Mahsulot haqida qisqacha"></textarea>
        </label>
        <button class="w-full rounded-xl bg-[#e11d2a] py-3 font-bold text-white">Mahsulotni saqlash</button>
      </form>
    </section>
  </div>

  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md bg-white rounded-[28px] p-1.5 shadow-[0_8px_30px_rgba(0,0,0,0.09)] border border-zinc-100 grid grid-cols-4 gap-1">

    <a href="/admin" class="flex flex-col items-center justify-center py-2 px-1 rounded-[22px] text-zinc-600 hover:bg-zinc-50 transition">
      <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69zM12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"/></svg>
      <span class="text-[11px] font-medium">Asosiy</span>
    </a>

    <a href="/admin/products" class="flex flex-col items-center justify-center py-2 px-1 rounded-[22px] bg-[#f7edd4] text-[#9a6715] transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      <span class="text-[11px] font-bold">Mahsulotlar</span>
    </a>

    <a href="/admin/orders" class="flex flex-col items-center justify-center py-2 px-1 rounded-[22px] text-zinc-600 hover:bg-zinc-50 transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      <span class="text-[11px] font-medium">Buyurtmalar</span>
    </a>

    <a href="/admin/users" class="flex flex-col items-center justify-center py-2 px-1 rounded-[22px] text-zinc-600 hover:bg-zinc-50 transition">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[11px] font-medium">Mijozlar</span>
    </a>

  </nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/frontend/js/admin_catalog.js"></script>
</body>
</html>
