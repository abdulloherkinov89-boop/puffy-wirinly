<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Burger – Savat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff;--tile:#f4f4f5;--ink:#18181b;--mut:#71717a;--line:#ececee;--red:#d92027;--red2:#b81a20;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(112px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
a{color:inherit;text-decoration:none}

/* sticky logo */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:52px;background:var(--bg);display:flex;justify-content:center;align-items:center;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;color:var(--red);font-family:Oswald,sans-serif;font-weight:600;font-size:26px}
.logo svg{width:44px;height:32px}

/* categories */
.cats{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:9;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:var(--tile);font-weight:600;font-size:13px;padding:8px 14px;border-radius:20px}
.cat.on{background:var(--ink);color:#fff}
h2{font-family:Oswald,sans-serif;font-weight:600;font-size:24px;margin:18px 14px 10px}

/* 2-column grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 14px}
.card{cursor:pointer}
.pic{aspect-ratio:1/1;background:var(--tile);border-radius:16px;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
.pic img,.big img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:3px 7px;border-radius:8px}
.plus{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1}
.price{margin-top:8px;font-weight:700;font-size:16px}
.price s{color:var(--mut);font-weight:500;font-size:13px;margin-left:6px}
.name{font-weight:600;font-size:14px;margin-top:2px}
.desc{color:var(--mut);font-size:12px;line-height:1.35;margin-top:2px}

/* product sheet (Yandex-style) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;max-height:92vh;background:#fff;border-radius:22px 22px 0 0;z-index:31;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;overflow:hidden}
.sheet.on{transform:none}
.x{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border:0;border-radius:17px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:15px;cursor:pointer}
.big{aspect-ratio:4/3;background:var(--tile);display:grid;place-items:center;font-size:120px;overflow:hidden}
.sheet .body{padding:16px 16px 8px;overflow-y:auto}
.mname{font-family:Oswald,sans-serif;font-weight:600;font-size:24px}
.mprice{margin-top:4px;font-weight:700;font-size:18px}
.mprice s{color:var(--mut);font-weight:500;font-size:14px;margin-left:8px}
.mdesc{color:var(--mut);font-size:14px;line-height:1.5;margin:10px 0 0}
.bar{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.step{display:flex;align-items:center;background:var(--tile);border-radius:14px}
.step button{all:unset;cursor:pointer;width:42px;height:48px;text-align:center;font-size:20px;font-weight:600}
.step span{min-width:22px;text-align:center;font-weight:700}
.step.sm button{height:36px;width:34px}
.go{flex:1;border:0;background:var(--red);color:#fff;font:700 15px Inter,sans-serif;border-radius:14px;cursor:pointer}
.go:active{background:var(--red2)}

/* bottom navbar (links to separate files) */
nav{position:fixed;bottom:0;left:0;right:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;margin-inline:auto}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mut);font-weight:600;font-size:11px}
nav a.on{color:var(--red)}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on svg.f{fill:currentColor}

/* cart */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row .t{font-size:30px;background:var(--tile);width:56px;height:56px;border-radius:12px;display:grid;place-items:center}
.row .i{flex:1}.row b{font-size:14px}.row small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding:16px 14px}
.order{display:block;width:calc(100% - 28px);margin:0 14px;border:0;background:var(--red);color:#fff;font:700 16px Inter,sans-serif;padding:14px;border-radius:14px}

/* orders */
.olist{display:grid;gap:12px;padding:0 14px}
.ocard{border:1px solid var(--line);border-radius:16px;padding:14px}
.otop{display:flex;justify-content:space-between;align-items:center}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:10px}
.st.wait{background:#fff4e0;color:#a15c00}.st.ok{background:#e6f6ec;color:#16803c}
.odate{color:var(--mut);font-size:12px;margin-top:4px}
.oitems{font-size:14px;margin:10px 0}
.osum{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}

/* profile */
.me{display:flex;align-items:center;gap:14px;padding:4px 14px 18px}
.av{width:60px;height:60px;border-radius:30px;background:var(--red);color:#fff;display:grid;place-items:center;font:600 26px Oswald,sans-serif}
.me small{display:block;color:var(--mut);margin-top:3px}
.lst{margin:0 14px;border:1px solid var(--line);border-radius:16px}
.li{display:flex;justify-content:space-between;padding:15px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.li:last-child{border-bottom:0}
.li small{color:var(--mut);font-weight:500}
</style>
</head>
<body>

<main><h2>Savat</h2><div class="row"><div class="t">🍔</div><div class="i"><b>KOMBO 1</b><small>78 000 so'm</small></div><div class="step sm"><button>−</button><span>1</span><button>+</button></div></div><div class="row"><div class="t">🌭</div><div class="i"><b>Klassik Hotdog</b><small>44 000 so'm</small></div><div class="step sm"><button>−</button><span>2</span><button>+</button></div></div><div class="row"><div class="t">🥤</div><div class="i"><b>Cola 0.5 L</b><small>9 000 so'm</small></div><div class="step sm"><button>−</button><span>1</span><button>+</button></div></div><div class="total"><span>Jami</span><span>131 000 so'm</span></div><button class="order">Buyurtma berish</button></main>

</body>
</html>
