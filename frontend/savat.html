<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Burger – Savat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ee;
  --panel:#f4f4f5;
  --white:#ffffff;
  --ink:#1a1b1f;
  --muted:#6a6b72;
  --line:#e8e6e3;
  --yellow:#f4c74d;
  --yellow-deep:#edb73b;
  --dark:#1f2126;
  --shadow:0 12px 24px rgba(15,15,15,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;max-width:460px;margin-inline:auto;padding:0 0 88px}
a{color:inherit;text-decoration:none}
button{font:inherit}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:var(--bg)}
.close-btn,.menu-btn,.header-icon{width:36px;height:36px;border-radius:50%;border:none;background:#2d2d2d;color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 4px 8px rgba(0,0,0,.12)}
.menu-btn{background:#ffffff;color:#1a1b1f}
.topbar-title{font-size:18px;font-weight:700;color:#1f2126;letter-spacing:-.02em}
.topbar-title span{opacity:.7;font-weight:600}

.user-info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 18px 0}
.user-wrap{display:flex;align-items:center;gap:12px;flex:1}
.user-avatar{width:56px;height:56px;border-radius:18px;background:#23262b;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
.user-name{font-size:15px;font-weight:700;line-height:1.2}
.user-name strong{display:block;font-size:27px;letter-spacing:-.04em}
.header-tools{display:flex;align-items:center;gap:12px}
.header-icon{background:#fff;color:#1a1b1f;width:42px;height:42px}

.balance-card{margin:16px 18px 12px;background:linear-gradient(90deg,var(--yellow),#f5d058);border-radius:24px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 18px rgba(226,175,60,.2)}
.balance-left{display:flex;align-items:center;gap:14px}
.balance-icon{width:46px;height:46px;border-radius:14px;background:#1f2126;color:#fff;display:grid;place-items:center;font-size:22px}
.balance-meta{display:flex;flex-direction:column;gap:4px}
.balance-label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2e2f35;opacity:.75}
.balance-amount{font-size:18px;font-weight:800;letter-spacing:-.03em}
.add-balance{border:none;border-radius:999px;padding:14px 20px;background:#fff;color:#1a1b1f;font-weight:800;font-size:20px;cursor:pointer;min-width:116px}

.channel-card{margin:10px 18px 14px;background:#f0f0f0;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.channel-avatar{width:46px;height:46px;border-radius:14px;background:#1f2126;color:#fff;display:grid;place-items:center;font-size:18px}
.channel-text{font-size:20px;font-weight:700;letter-spacing:-.03em}

.cart-box{margin:8px 18px 0;padding:0 0 18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{font-size:30px;background:#f2f2f2;width:56px;height:56px;border-radius:12px;display:grid;place-items:center}
.row .i{flex:1}.row b{font-size:15px}.row small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
.step{display:flex;align-items:center;background:#f0f0f0;border-radius:12px;overflow:hidden}
.step button{all:unset;cursor:pointer;width:28px;height:32px;text-align:center;font-size:22px;font-weight:700;padding:0 4px}
.step span{min-width:22px;text-align:center;font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:18px 0 12px}
.order{display:block;width:100%;border:0;background:#1a1b1f;color:#fff;font:700 16px Inter,sans-serif;padding:15px;border-radius:14px}

.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#6a6b72;font-weight:700;font-size:11px}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:#1a1b1f}
.nav-item.active .icon-fill{fill:currentColor;stroke:none}
</style>
</head>
<body>
<header class="topbar">
  <button class="close-btn" aria-label="Yopish">✕</button>
  <div class="topbar-title"><span>Yopish</span></div>
  <button class="menu-btn" aria-label="Menyu">☰</button>
</header>

<section class="user-info">
  <div class="user-wrap">
    <div class="user-avatar">A</div>
    <div class="user-name"><span>Xush kelibsiz</span><strong>Erkinov</strong></div>
  </div>
  <div class="header-tools">
    <button class="header-icon" aria-label="Light mode">☼</button>
    <button class="header-icon" aria-label="Notifications">🔔</button>
  </div>
</section>

<div class="balance-card">
  <div class="balance-left">
    <div class="balance-icon">🛍️</div>
    <div class="balance-meta">
      <span class="balance-label">BALANS</span>
      <span class="balance-amount">0 so'm</span>
    </div>
  </div>
  <button class="add-balance" aria-label="To'ldirish">+ To'ldirish</button>
</div>

<div class="channel-card">
  <div class="channel-avatar">A</div>
  <div class="channel-text">Abuser asosiy telegram kanali</div>
</div>

<div class="cart-box">
  <div class="row"><div class="t">🍔</div><div class="i"><b>KOMBO 1</b><small>78 000 so'm</small></div><div class="step"><button>−</button><span>1</span><button>+</button></div></div>
  <div class="row"><div class="t">🌭</div><div class="i"><b>Klassik Hotdog</b><small>44 000 so'm</small></div><div class="step"><button>−</button><span>2</span><button>+</button></div></div>
  <div class="row"><div class="t">🥤</div><div class="i"><b>Cola 0.5 L</b><small>9 000 so'm</small></div><div class="step"><button>−</button><span>1</span><button>+</button></div></div>
  <div class="total"><span>Jami</span><span>131 000 so'm</span></div>
  <button class="order">Buyurtma berish</button>
</div>

<nav class="bottom-nav">
  <a href="/frontend/home.html" class="nav-item" aria-label="Menyu">
    <svg class="icon-fill" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v8.5a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    <span>Bosh sahifa</span>
  </a>
  <a href="/frontend/savat.html" class="nav-item active" aria-label="Savat">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/><path d="M3 4h2l2.8 11.2A1 1 0 0 0 8.8 16h7.9a1 1 0 0 0 1-.8L20 7H6"/></svg>
    <span>Savat</span>
  </a>
  <a href="/frontend/buyurtmalarim.html" class="nav-item" aria-label="Buyurtmalar">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
    <span>Buyurtmalar</span>
  </a>
  <a href="/frontend/profile.html" class="nav-item" aria-label="Profil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.7-3.2 5-4.8 8-4.8S18.3 16.8 20 20"/></svg>
    <span>Profil</span>
  </a>
</nav>
</body>
</html>
